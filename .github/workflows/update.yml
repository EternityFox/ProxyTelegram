name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '17 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Generate verified proxy files
      run: python scripts/generate_proxies.py --top 200 --output-dir verified

    - name: Check generated files
      run: |
        test -f verified/proxies.json
        test -f verified/proxy_all_verified.json
        test -f verified/proxy_ru_verified.txt
        test -f verified/proxy_eu_verified.txt
        test -f verified/proxy_all_verified.txt

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add index.html README.md requirements.txt main.py scripts/generate_proxies.py .github/workflows/update.yml
        git add verified/proxies.json verified/proxy_all_verified.json verified/proxy_stats_verified.json
        git add verified/proxy_ru_verified.txt verified/proxy_eu_verified.txt verified/proxy_all_verified.txt
        git add verified/proxy_all_tme_verified.txt verified/proxy_links_clean.txt verified/proxy_links_tme_clean.txt
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update verified proxy lists"
          git push
        fi
